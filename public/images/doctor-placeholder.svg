<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f7f6" />
      <stop offset="50%" stop-color="#e5f1ef" />
      <stop offset="100%" stop-color="#d6e8e5" />
    </linearGradient>

    <!-- Coat Gradients -->
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e8efee" />
    </linearGradient>

    <linearGradient id="coatShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d1dedc" />
      <stop offset="100%" stop-color="#b8cbc8" />
    </linearGradient>

    <!-- Inner Scrub Gradient -->
    <linearGradient id="scrubGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e4e50" />
      <stop offset="100%" stop-color="#093537" />
    </linearGradient>

    <!-- Stethoscope Tubing Gradient -->
    <linearGradient id="tubingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a393b" />
      <stop offset="50%" stop-color="#0e4e50" />
      <stop offset="100%" stop-color="#0a393b" />
    </linearGradient>

    <!-- Metal Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0e4e50" flood-opacity="0.12" />
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="750" fill="url(#bgGradient)" />

  <!-- Subtle Medical Geometric Accent Lines -->
  <g opacity="0.35" stroke="#0e4e50" stroke-width="1" fill="none">
    <circle cx="300" cy="280" r="190" stroke-dasharray="4 6" opacity="0.5" />
    <circle cx="300" cy="280" r="240" stroke-dasharray="2 8" opacity="0.3" />
    <circle cx="300" cy="280" r="290" opacity="0.2" />
  </g>

  <!-- Subtle Medical Cross Motifs in corners -->
  <g opacity="0.18" fill="#0e4e50">
    <path d="M 60 70 h 20 v -20 h 12 v 20 h 20 v 12 h -20 v 20 h -12 v -20 h -20 z" />
    <path d="M 500 110 h 14 v -14 h 8 v 14 h 14 v 8 h -14 v 14 h -8 v -14 h -14 z" />
  </g>

  <!-- Doctor Figure Group with Filter -->
  <g filter="url(#softShadow)">

    <!-- Shoulders & Coat Base -->
    <path d="M 120 750 C 120 560 180 500 230 470 L 300 520 L 370 470 C 420 500 480 560 480 750 Z"
          fill="url(#coatGrad)" />

    <!-- Inner V-Neck (Scrub / Clinical Attire) -->
    <path d="M 255 450 L 300 525 L 345 450 Z" fill="url(#scrubGrad)" />
    <!-- V-Neck Line Trim -->
    <path d="M 255 450 L 300 525 L 345 450" stroke="#14b8a6" stroke-width="3" fill="none" opacity="0.8" />

    <!-- Lab Coat Left Flap & Lapel -->
    <path d="M 230 470 L 270 440 L 265 570 L 220 750 L 120 750 C 120 560 180 500 230 470 Z"
          fill="#f8fbfa" />
    <path d="M 270 440 L 245 530 L 275 580 L 272 750 L 220 750 L 265 570 Z"
          fill="url(#coatShadow)" opacity="0.3" />

    <!-- Lab Coat Right Flap & Lapel -->
    <path d="M 370 470 L 330 440 L 335 570 L 380 750 L 480 750 C 480 560 420 500 370 470 Z"
          fill="#edf4f3" />
    <path d="M 330 440 L 355 530 L 325 580 L 328 750 L 380 750 L 335 570 Z"
          fill="url(#coatShadow)" opacity="0.4" />

    <!-- Coat Center Seam & Buttons -->
    <line x1="300" y1="535" x2="300" y2="750" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="1 1" />
    <circle cx="300" cy="590" r="4" fill="#cbd5e1" />
    <circle cx="300" cy="650" r="4" fill="#cbd5e1" />
    <circle cx="300" cy="710" r="4" fill="#cbd5e1" />

    <!-- Doctor Stethoscope Around Neck -->
    <!-- Left loop -->
    <path d="M 268 430 C 265 470 255 530 250 560 C 245 590 260 620 275 625 C 285 628 292 618 290 600 C 288 580 285 535 285 500"
          stroke="url(#tubingGrad)" stroke-width="9" stroke-linecap="round" fill="none" />
    <!-- Right loop -->
    <path d="M 332 430 C 335 470 345 530 350 550 C 355 575 352 610 335 635 C 322 650 310 655 305 668 L 305 680"
          stroke="url(#tubingGrad)" stroke-width="9" stroke-linecap="round" fill="none" />

    <!-- Metal Earpieces entering behind neck -->
    <path d="M 270 435 C 268 400 278 375 288 365" stroke="url(#metalGrad)" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M 330 435 C 332 400 322 375 312 365" stroke="url(#metalGrad)" stroke-width="5" stroke-linecap="round" fill="none" />

    <!-- Stethoscope Chest Piece / Diaphragm -->
    <g transform="translate(305, 690)">
      <circle cx="0" cy="0" r="16" fill="url(#metalGrad)" stroke="#64748b" stroke-width="1.5" />
      <circle cx="0" cy="0" r="12" fill="#0e4e50" opacity="0.85" />
      <circle cx="0" cy="0" r="6" fill="url(#metalGrad)" />
    </g>

    <!-- Doctor Pocket with Pen / Badge on Left Chest -->
    <g transform="translate(200, 560)">
      <path d="M 0 0 L 36 0 L 33 42 L 3 42 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <!-- Doctor badge clip -->
      <rect x="10" y="-8" width="16" height="12" rx="2" fill="#0e4e50" />
      <rect x="14" y="4" width="8" height="2" fill="#14b8a6" />
    </g>

    <!-- Neck -->
    <path d="M 270 360 L 270 440 C 270 460 330 460 330 440 L 330 360 Z" fill="#1b4d4f" />
    <!-- Neck shadow under chin -->
    <path d="M 270 360 C 285 375 315 375 330 360 C 330 375 330 385 330 395 C 315 405 285 405 270 395 Z"
          fill="#133a3c" opacity="0.5" />

    <!-- Head & Professional Hair Silhouette -->
    <!-- Base Head Shape -->
    <ellipse cx="300" cy="315" rx="52" ry="64" fill="#1b4d4f" />

    <!-- Elegant Hair Silhouette (Professional medical updo / styled hair) -->
    <!-- Hair bun / top -->
    <circle cx="300" cy="225" r="38" fill="#153d3f" />
    <ellipse cx="300" cy="275" rx="68" ry="62" fill="#153d3f" />
    <!-- Side hair contours -->
    <path d="M 235 295 C 235 250 260 230 300 230 C 340 230 365 250 365 295 C 365 340 355 360 355 360 C 345 315 335 300 300 300 C 265 300 255 315 245 360 C 245 360 235 340 235 295 Z"
          fill="#153d3f" />
  </g>

  <!-- Clean Minimalist Status Badge at Bottom -->
  <g transform="translate(300, 715)" filter="url(#badgeShadow)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#ffffff" stroke="#d5e5e3" stroke-width="1.5" />
    <circle cx="-115" cy="0" r="5" fill="#0e4e50" />
    <circle cx="-115" cy="0" r="8" fill="#0e4e50" opacity="0.25" />
    <text x="-95" y="4" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="12" font-weight="700" fill="#0e4e50" letter-spacing="1">DR. ADITI GARG</text>
    <text x="32" y="4" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="11" font-weight="500" fill="#64748b" letter-spacing="0.5">| ENT SPECIALIST</text>
  </g>
</svg>
